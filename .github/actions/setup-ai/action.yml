name: Setup AI Engine
description: Setup AI dependencies, cache and vector index
runs:
  using: composite
  steps:
    - name: Cache Python Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('ai-engine/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache HuggingFace Models
      uses: actions/cache@v3
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-${{ hashFiles('ai-engine/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-hf-
    - name: Install Python Dependencies
      shell: bash
      run: pip install -r ai-engine/requirements.txt
    - name: Build Vector Index
      shell: bash
      run: python ai-engine/vector_store.py
