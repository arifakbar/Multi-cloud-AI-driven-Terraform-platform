name: Setup Python AI Dependencies
description: Setup Python, install AI dependencies and restore caches
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
    - name: Cache Python Dependencies
      uses: actions/cache@v3
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('ai-engine/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-
    - name: Cache HuggingFace Models
      uses: actions/cache@v3
      with:
        path: ~/.cache/huggingface
        key: ${{ runner.os }}-hf-${{ hashFiles('ai-engine/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-hf-
    - name: Install Python Dependencies
      shell: bash
      run: pip install -r ai-engine/requirements.txt
