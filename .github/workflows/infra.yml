name: Multi-Cloud Infrastructure Deployment

on:
  workflow_dispatch:
    inputs:
      cloud:
        description: 'Which cloud to deploy?'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - azure
          - aws

permissions:
  id-token: write
  contents: read

env:
  #LLM
  GROQ_API_KEY: ${{secrets.GROQ_API_KEY}}

  # Azure
  ARM_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
  ARM_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
  ARM_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
  ARM_USE_OIDC: true

  # AWS
  AWS_ARN: arn:aws:iam::007222077088:role/Github-Actions
  AWS_REGION: us-east-1

# ----------------------------
# Azure Terraform Plan
# ----------------------------
jobs:

  terraform-plan-azure:
    name: Terraform Plan (Azure)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'azure' }}

    outputs:
      approval_required: ${{ steps.approval_check.outputs.approval_required }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup AI Engine
        uses: ./.github/actions/setup-ai

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Terraform Plan
        uses: ./.github/actions/terraform-plan
        with:
          working-directory: terraform/azure

      - name: Run AI Analyzer
        id: analyzer
        run: |
         python ai-engine/main.py terraform/azure/plan.json
    
      - name: Publish Report
        run: |
          cat SECURITY_REPORT.md
      
      - name: Check Approval Requirement
        id: approval_check
        run: |
          if grep -q "Approval Required: \*\*True\*\*" SECURITY_REPORT.md; then
            echo "approval_required=true" >> $GITHUB_OUTPUT
            echo "Approval Required"
          else
            echo "approval_required=false" >> $GITHUB_OUTPUT
            echo "Approval Not Required"
          fi

# ----------------------------
# Azure High Risk Approval
# ----------------------------

  azure-high-risk-approval:
    name: Azure High Risk Approval
    runs-on: ubuntu-latest
    needs: terraform-plan-azure

    if: always() && (github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'azure') && needs.terraform-plan-azure.outputs.approval_required == 'true'

    environment: high-risk-azure

    steps:
      - name: Risk Evaluation
        run: |
          echo "High Risk: ${{ needs.terraform-plan-azure.outputs.approval_required }}"
          if [ "${{ needs.terraform-plan-azure.outputs.approval_required }}" = "true" ]; then
            echo "Manual approval required."
          else
            echo "No approval required. Auto passing."
          fi


# ----------------------------
# Azure Apply
# ----------------------------

  terraform-apply-azure:
    name: Terraform Apply (Azure)
    runs-on: ubuntu-latest
    needs:
      - terraform-plan-azure
      - azure-high-risk-approval
    
    if: |
      always() &&
      needs.terraform-plan-azure.result == 'success' &&
      (
        needs.terraform-plan-azure.outputs.approval_required == 'false' ||
        needs.azure-high-risk-approval.result == 'success'
      )

    environment: Apply

    defaults:
      run:
        working-directory: terraform/azure

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          client-id: ${{ env.ARM_CLIENT_ID }}
          tenant-id: ${{ env.ARM_TENANT_ID }}
          subscription-id: ${{ env.ARM_SUBSCRIPTION_ID }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan


# ----------------------------
# AWS Terraform Plan
# ----------------------------

  terraform-plan-aws:
    name: Terraform Plan (AWS)
    runs-on: ubuntu-latest
    if: ${{ github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'aws' }}

    outputs:
      approval_required: ${{ steps.approval_check.outputs.approval_required }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup AI Engine
        uses: ./.github/actions/setup-ai

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Terraform Plan
        uses: ./.github/actions/terraform-plan
        with:
          working-directory: terraform/aws

      - name: Run AI Analyzer
        id: analyzer
        run: |
         python ai-engine/main.py terraform/aws/plan.json

      - name: Publish Report
        run: |
          cat SECURITY_REPORT.md
      
      - name: Check Approval Requirement
        id: approval_check
        run: |
          if grep -q "Approval Required: \*\*True\*\*" SECURITY_REPORT.md; then
            echo "approval_required=true" >> $GITHUB_OUTPUT
            echo "Approval Required"
          else
            echo "approval_required=false" >> $GITHUB_OUTPUT
            echo "Approval Not Required"
          fi

# ----------------------------
# AWS High Risk Approval
# ----------------------------

  aws-high-risk-approval:
    name: AWS High Risk Approval
    runs-on: ubuntu-latest
    needs: terraform-plan-aws

    if: always() && (github.event.inputs.cloud == 'all' || github.event.inputs.cloud == 'aws') && needs.terraform-plan-aws.outputs.approval_required == 'true'

    environment: high-risk-aws

    steps:
      - name: Risk Evaluation
        run: |
          echo "High Risk: ${{ needs.terraform-plan-aws.outputs.approval_required }}"
          if [ "${{ needs.terraform-plan-aws.outputs.approval_required }}" = "true" ]; then
            echo "Manual approval required."
          else
            echo "No approval required. Auto passing."
          fi

# ----------------------------
# AWS Apply
# ----------------------------

  terraform-apply-aws:
    name: Terraform Apply (AWS)
    runs-on: ubuntu-latest

    needs:
      - terraform-plan-aws
      - aws-high-risk-approval
    
    if: |
      always() &&
      needs.terraform-plan-aws.result == 'success' &&
      (
        needs.terraform-plan-aws.outputs.approval_required == 'false' ||
        needs.aws-high-risk-approval.result == 'success'
      )

    environment: Apply-AWS

    defaults:
      run:
        working-directory: terraform/aws

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configure AWS Credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v2
        with:
          role-to-assume: ${{ env.AWS_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init

      - name: Terraform Plan
        run: terraform plan -out=tfplan

      - name: Terraform Apply
        run: terraform apply -auto-approve tfplan